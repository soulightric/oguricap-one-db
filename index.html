<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Etherthink Status</title>
    <meta name="description" content="Status layanan dan uptime Etherthink secara langsung.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#f4f6fb">
    <link rel="canonical" href="https://status.etherthink.xyz/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="id_ID">
    <meta property="og:site_name" content="Etherthink">
    <meta property="og:title" content="Etherthink Status">
    <meta property="og:description" content="Status layanan dan uptime Etherthink secara langsung.">
    <meta property="og:url" content="https://status.etherthink.xyz/">
    <meta property="og:image" content="https://proxy-assets.etherthink.xyz/images/etherthink-status-og.png">
    <meta property="og:image:secure_url" content="https://proxy-assets.etherthink.xyz/images/etherthink-status-og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Etherthink Status, status layanan dan uptime Etherthink">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Etherthink Status">
    <meta name="twitter:description" content="Status layanan dan uptime Etherthink secara langsung.">
    <meta name="twitter:image" content="https://proxy-assets.etherthink.xyz/images/etherthink-status-og.png">
    <meta name="twitter:image:alt" content="Etherthink Status, status layanan dan uptime Etherthink">
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%233b4cca' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%233b4cca'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

    <header class="top">
        <div class="wrap">
            <a class="brand" href="https://www.etherthink.xyz" aria-label="Etherthink">
                <svg viewBox="0 0 32 32" aria-hidden="true">
                    <circle cx="16" cy="16" r="11" fill="none" stroke="var(--accent)" stroke-width="4" />
                    <circle cx="16" cy="16" r="4" fill="var(--accent)" />
                </svg>
                Etherthink <span>Synergy Frontier</span>
            </a>
            <div class="top-actions">
                <button class="btn" id="themeBtn" type="button">Tema</button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <div class="hero" id="hero" data-state="load" role="status" aria-live="polite">
            <div class="pulse" aria-hidden="true"></div>
            <div>
                <h1 id="heroTitle">Memeriksa layanan…</h1>
                <p id="heroSub">Mengambil status terbaru.</p>
            </div>
        </div>

        <section aria-labelledby="h-uptime">
            <h2 id="h-uptime">Uptime</h2>
            <div class="card" id="components"></div>
        </section>

        <section aria-labelledby="h-incidents">
            <h2 id="h-incidents">Insiden terbaru</h2>
            <div class="card" id="incidents"></div>
        </section>
    </main>

    <footer class="wrap">
        <div>Terakhir diperiksa <span id="lastCheck">–</span>. Halaman ini memeriksa ulang setiap menit.</div>
    </footer>

    <div class="tip" id="tip" role="tooltip"></div>

    <script src="/script.js" defer></script>
</body>

</html>
